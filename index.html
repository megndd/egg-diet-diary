<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef7f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="轻盈饮食日记">
  <title>蛋蛋的轻盈饮食日记</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" aria-label="主要导航">
      <button class="tab is-active" data-tab="dashboard" type="button" aria-label="首页">
        <span class="tab-icon">⌂</span><span>首页</span>
      </button>
      <button class="tab" data-tab="today" type="button" aria-label="今日记录">
        <span class="tab-icon">✎</span><span>记录</span>
      </button>
      <button class="tab" data-tab="bloating" type="button" aria-label="胀气观察">
        <span class="tab-icon">◇</span><span>观察</span>
      </button>
      <button class="tab" data-tab="trends" type="button" aria-label="趋势统计">
        <span class="tab-icon">↗</span><span>趋势</span>
      </button>
      <button class="tab" data-tab="profile" type="button" aria-label="我的资料">
        <span class="tab-icon">○</span><span>我的</span>
      </button>
    </nav>
  </div>

  <template id="meal-template">
    <div class="food-row">
      <div class="row-head">
        <strong>食物</strong>
        <button class="icon-btn danger remove-food" type="button" aria-label="删除食物">×</button>
      </div>
      <label>食物名称<input name="name" placeholder="例如 鸡蛋米饭西兰花"></label>
      <label>大致份量<input name="amount" placeholder="例如 一碗 / 半份 / 一杯"></label>
      <label>烹饪方式<input name="cookingMethod" placeholder="例如 清蒸 / 辛辣 / 冷食"></label>
      <label>备注<textarea name="notes" rows="2" placeholder="可选"></textarea></label>
      <div class="risk-preview"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
